name: Deploy homepage to Azure Web App - nacho

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-nacho-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Test homepage server
        run: |
          npm ci
          npm test

      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp index.html server.js roulette.js table-store.js package.json package-lock.json deploy/
          npm ci --omit=dev --prefix deploy

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: deploy/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88C80F32D7FF4E0B8B23AFE7E2BB2F09 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BFA5BCDE28C44F6981EA40EC4681F30E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C03E7724126C4166BE5195CECA09C4BE }}

      - name: Configure Linux runtime and startup command
        run: |
          resource_group=$(az webapp list --query "[?name=='nacho'].resourceGroup | [0]" --output tsv)
          if [ -z "$resource_group" ]; then
            echo "::error::Azure Web App nacho was not found in the configured subscription."
            exit 1
          fi
          is_linux=$(az webapp show --name nacho --resource-group "$resource_group" --query reserved --output tsv)
          if [ "$is_linux" != "true" ]; then
            echo "::error::Azure Web App nacho must be a Linux app."
            exit 1
          fi
          az webapp config set --name nacho --resource-group "$resource_group" \
            --linux-fx-version 'NODE|24-lts' --startup-file 'npm start' --output none

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: nacho
          slot-name: Production
          package: deploy
          startup-command: 'npm start'

      - name: Verify deployed homepage
        timeout-minutes: 5
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          if [ -z "$WEBAPP_URL" ]; then
            echo "::error::Deployment did not return the Web App URL."
            exit 1
          fi
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 15 "$WEBAPP_URL" --output homepage.html &&
              cmp --silent deploy/index.html homepage.html; then
              echo "Deployed homepage matches index.html."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed homepage did not match index.html."
          exit 1
