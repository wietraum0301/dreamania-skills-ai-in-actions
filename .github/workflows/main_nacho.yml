name: Deploy homepage to Azure Web App - nacho

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-nacho-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Test homepage server
        run: npm test

      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp index.html server.js package.json deploy/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: deploy/

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_946C73FB6C6848CDAF17E775D173E07C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EECD135E84664A2B9773D2A434AEC45D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3DE9D946C20F43CEAEE071F46F9EA7A3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: nacho
          slot-name: Production
          package: deploy
          startup-command: 'npm start'
